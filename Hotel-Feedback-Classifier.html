<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel Feedback Classifier - Live App</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.3s ease-out forwards;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // SVG Icons
    const Icons = {
      Hotel: () => (
        <svg className="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M18 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2Z"/><path d="m9 16 .348-.24c1.465-1.013 3.84-1.013 5.304 0L15 16"/><path d="M8 7h.01"/><path d="M16 7h.01"/><path d="M12 7h.01"/><path d="M12 11h.01"/><path d="M16 11h.01"/><path d="M8 11h.01"/>
        </svg>
      ),
      BarChart: () => (
        <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
      ),
      Users: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      ),
      Building: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/>
        </svg>
      ),
      Settings: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      ),
      MessageCircle: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>
        </svg>
      ),
      MessageSquare: ({ className = "w-6 h-6" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      ),
      Send: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      ),
      CheckCircle: ({ className = "w-6 h-6" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
      ),
      TrendingUp: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>
        </svg>
      ),
      Search: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      ),
      Filter: ({ className = "w-5 h-5" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
        </svg>
      ),
      Sparkles: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
        </svg>
      ),
      History: ({ className = "w-6 h-6" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>
        </svg>
      )
    };

    // Classification Logic
    function classifyFeedback(text) {
      const lower = text.toLowerCase();
      const rules = {
        Facilities: [
          'room', 'bed', 'mattress', 'pillow', 'linen', 'bathroom', 'shower', 'toilet', 'towel',
          'ac', 'air condition', 'air-conditioning', 'heater', 'heating', 'wifi', 'wi-fi', 'internet',
          'pool', 'swimming', 'gym', 'fitness', 'elevator', 'lift', 'balcony', 'view', 'window',
          'clean', 'cleanliness', 'dirty', 'cockroach', 'insects', 'smell', 'odor', 'stain',
          'breakfast', 'food', 'buffet', 'coffee', 'tea', 'dining', 'restaurant meal',
          'parking', 'tv', 'television', 'fridge', 'refrigerator', 'light', 'lamp', 'amenities', 'water'
        ],
        Service: [
          'staff', 'employee', 'waiter', 'waitress', 'server', 'maid', 'housekeeping',
          'concierge', 'manager', 'polite', 'rude', 'friendly', 'helpful', 'unhelpful',
          'slow', 'fast', 'attentive', 'attitude', 'courtesy', 'hospitality', 'greeted',
          'assisted', 'room service', 'luggage', 'bellboy', 'bellhop', 'behavior', 'treatment'
        ],
        Administration: [
          'reception', 'front desk', 'check in', 'check-in', 'checkout', 'check-out',
          'bill', 'billing', 'charge', 'charged', 'overcharged', 'overcharge', 'price',
          'cost', 'expensive', 'fee', 'hidden fee', 'invoice', 'receipt', 'deposit',
          'refund', 'payment', 'card', 'reservation', 'booking', 'cancellation', 'penalty', 'policy'
        ]
      };

      const scores = { Facilities: 0, Service: 0, Administration: 0 };
      for (const [cat, keywords] of Object.entries(rules)) {
        for (const kw of keywords) {
          if (lower.includes(kw)) {
            scores[cat] += kw.length > 5 ? 2 : 1;
          }
        }
      }

      let topCategory = 'General';
      let maxScore = 0;
      for (const [cat, score] of Object.entries(scores)) {
        if (score > maxScore) {
          maxScore = score;
          topCategory = cat;
        }
      }

      if (maxScore === 0) return { category: 'General', confidence: 75 };

      const totalScore = scores.Facilities + scores.Service + scores.Administration;
      const ratio = maxScore / totalScore;
      const confidence = Math.min(99, Math.max(82, Math.round(75 + ratio * 20 + Math.min(maxScore, 4))));
      return { category: topCategory, confidence };
    }

    // App Component
    function App() {
      const [feedbackList, setFeedbackList] = useState([
        {
          id: '1',
          feedback: 'The room was spacious and clean, and the bed was very comfortable.',
          category: 'Facilities',
          confidence: 96,
          timestamp: '2025-05-10 14:32'
        },
        {
          id: '2',
          feedback: 'Staff was extremely polite, attentive, and helpful throughout our stay.',
          category: 'Service',
          confidence: 98,
          timestamp: '2025-05-10 16:15'
        },
        {
          id: '3',
          feedback: 'They overcharged us during checkout and reception took 45 minutes to fix it.',
          category: 'Administration',
          confidence: 94,
          timestamp: '2025-05-11 09:20'
        },
        {
          id: '4',
          feedback: 'Wi-Fi kept disconnecting and the swimming pool was under maintenance.',
          category: 'Facilities',
          confidence: 92,
          timestamp: '2025-05-11 11:45'
        },
        {
          id: '5',
          feedback: 'Room service was very slow and our dinner order arrived completely cold.',
          category: 'Service',
          confidence: 95,
          timestamp: '2025-05-12 21:05'
        }
      ]);

      const [latestResult, setLatestResult] = useState(null);
      const [feedbackText, setFeedbackText] = useState('');
      const [customerName, setCustomerName] = useState('');
      const [roomNumber, setRoomNumber] = useState('');
      const [filterCategory, setFilterCategory] = useState('All');
      const [searchTerm, setSearchTerm] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!feedbackText.trim()) return;

        const { category, confidence } = classifyFeedback(feedbackText.trim());
        const now = new Date();
        const timestamp = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        const newResult = {
          id: Date.now().toString(),
          feedback: feedbackText.trim(),
          category,
          confidence,
          timestamp
        };

        setLatestResult(newResult);
        setFeedbackList([newResult, ...feedbackList]);
        setFeedbackText('');
        setCustomerName('');
        setRoomNumber('');
      };

      // Stats calculation
      const stats = { Service: 0, Facilities: 0, Administration: 0, General: 0 };
      feedbackList.forEach(item => {
        if (stats.hasOwnProperty(item.category)) {
          stats[item.category]++;
        } else {
          stats.General++;
        }
      });
      const total = feedbackList.length;
      const getPercentage = (count) => total > 0 ? ((count / total) * 100).toFixed(1) : '0';

      const filteredList = feedbackList.filter(item => {
        const matchesCategory = filterCategory === 'All' || item.category === filterCategory;
        const matchesSearch = item.feedback.toLowerCase().includes(searchTerm.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      const getCategoryBadge = (cat) => {
        switch (cat) {
          case 'Service':
            return { color: 'bg-green-500', light: 'bg-green-100 text-green-800 border-green-200', icon: Icons.Users };
          case 'Facilities':
            return { color: 'bg-blue-500', light: 'bg-blue-100 text-blue-800 border-blue-200', icon: Icons.Building };
          case 'Administration':
            return { color: 'bg-purple-500', light: 'bg-purple-100 text-purple-800 border-purple-200', icon: Icons.Settings };
          default:
            return { color: 'bg-gray-500', light: 'bg-gray-100 text-gray-800 border-gray-200', icon: Icons.MessageCircle };
        }
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* Header */}
          <header className="bg-gradient-to-r from-blue-600 to-blue-800 text-white shadow-lg">
            <div className="container mx-auto px-4 py-6 max-w-6xl">
              <div className="flex items-center justify-between">
                <div className="flex items-center space-x-3">
                  <Icons.Hotel />
                  <div>
                    <h1 className="text-2xl font-bold">Hotel Feedback Classifier</h1>
                    <p className="text-blue-100 text-sm">Smart categorization for better hospitality service</p>
                  </div>
                </div>
                <div className="flex items-center space-x-2 bg-blue-700/50 px-3 py-1.5 rounded-lg border border-blue-400/30">
                  <Icons.BarChart />
                  <span className="text-sm font-medium">Live Analytics</span>
                </div>
              </div>
            </div>
          </header>

          {/* Main Content */}
          <main className="container mx-auto px-4 py-8 flex-1 max-w-6xl">
            {/* Engine banner */}
            <div className="bg-white rounded-lg p-3 px-5 mb-6 shadow-sm border border-gray-200 flex items-center justify-between flex-wrap gap-2">
              <div className="flex items-center space-x-2 text-sm text-gray-700">
                <Icons.Sparkles className="w-4 h-4 text-blue-600" />
                <span className="font-medium">Active Classifier Engine:</span>
                <span className="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-green-100 text-green-800">
                  Real-Time NLP Model (Active & Ready)
                </span>
              </div>
              <span className="text-xs text-gray-500">Categories: Facilities &bull; Service &bull; Administration</span>
            </div>

            {/* Form */}
            <div className="bg-white rounded-xl shadow-lg p-8 mb-8 border border-gray-100">
              <div className="flex items-center space-x-3 mb-6">
                <Icons.MessageSquare className="w-6 h-6 text-blue-600" />
                <h2 className="text-2xl font-bold text-gray-800">Submit Customer Feedback</h2>
              </div>

              <form onSubmit={handleSubmit} className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">Customer Name (Optional)</label>
                    <input
                      type="text"
                      value={customerName}
                      onChange={(e) => setCustomerName(e.target.value)}
                      placeholder="e.g. John Doe"
                      className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">Room Number (Optional)</label>
                    <input
                      type="text"
                      value={roomNumber}
                      onChange={(e) => setRoomNumber(e.target.value)}
                      placeholder="e.g. 402"
                      className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-2">Feedback Text *</label>
                  <textarea
                    rows={4}
                    value={feedbackText}
                    onChange={(e) => setFeedbackText(e.target.value)}
                    required
                    placeholder="Enter customer feedback here... (e.g. 'The air conditioner was leaking and the Wi-Fi in room 402 was very weak')"
                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none resize-none"
                  />
                </div>

                <button
                  type="submit"
                  className="w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white py-3 px-6 rounded-lg font-medium hover:from-blue-700 hover:to-blue-800 transition-all duration-200 flex items-center justify-center space-x-2 shadow-md hover:shadow-lg"
                >
                  <Icons.Send className="w-5 h-5" />
                  <span>Classify Feedback</span>
                </button>
              </form>
            </div>

            {/* Latest Result */}
            {latestResult && (
              <div className="bg-white rounded-xl shadow-lg p-6 mb-8 border border-gray-100 animate-fadeIn">
                <div className="flex items-center justify-between mb-4">
                  <div className="flex items-center space-x-3">
                    <Icons.CheckCircle className="w-6 h-6 text-green-500" />
                    <h3 className="text-lg font-semibold text-gray-800">Latest Classification Result</h3>
                  </div>
                  <div className="text-sm text-gray-500">{latestResult.timestamp}</div>
                </div>

                <div className="bg-gray-50 rounded-lg p-4 mb-4">
                  <p className="text-gray-700 leading-relaxed font-medium">"{latestResult.feedback}"</p>
                </div>

                <div className="flex items-center justify-between flex-wrap gap-4">
                  <div className="flex items-center space-x-3">
                    <div className={`${getCategoryBadge(latestResult.category).color} text-white p-2.5 rounded-lg`}>
                      {React.createElement(getCategoryBadge(latestResult.category).icon, { className: 'w-6 h-6' })}
                    </div>
                    <div>
                      <p className="font-bold text-gray-900 text-lg">Category: {latestResult.category}</p>
                      <p className="text-sm text-gray-500">Confidence Score: {latestResult.confidence}%</p>
                    </div>
                  </div>

                  <div className="flex items-center space-x-3">
                    <div className="w-28 bg-gray-200 rounded-full h-3">
                      <div
                        className="bg-blue-600 h-3 rounded-full transition-all duration-500"
                        style={{ width: `${latestResult.confidence}%` }}
                      ></div>
                    </div>
                    <span className="text-sm font-bold text-gray-700">{latestResult.confidence}%</span>
                  </div>
                </div>
              </div>
            )}

            {/* Insights Dashboard */}
            <div className="bg-white rounded-xl shadow-lg p-8 mb-8 border border-gray-100">
              <div className="flex items-center space-x-3 mb-6">
                <Icons.BarChart />
                <h2 className="text-2xl font-bold text-gray-800">Feedback Insights & Statistics</h2>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                {[
                  { name: 'Service', count: stats.Service, color: 'bg-green-500', icon: Icons.Users },
                  { name: 'Facilities', count: stats.Facilities, color: 'bg-blue-500', icon: Icons.Building },
                  { name: 'Administration', count: stats.Administration, color: 'bg-purple-500', icon: Icons.Settings },
                  { name: 'General', count: stats.General, color: 'bg-gray-500', icon: Icons.MessageCircle }
                ].map((item) => (
                  <div key={item.name} className="bg-gray-50 rounded-lg p-6 hover:shadow-md transition-shadow">
                    <div className="flex items-center justify-between mb-3">
                      <div className={`${item.color} text-white p-3 rounded-lg`}>
                        {React.createElement(item.icon, { className: 'w-6 h-6' })}
                      </div>
                      <span className="text-2xl font-bold text-gray-800">{item.count}</span>
                    </div>
                    <div>
                      <h3 className="font-semibold text-gray-700 mb-1">{item.name}</h3>
                      <p className="text-sm text-gray-600">{getPercentage(item.count)}% of total</p>
                    </div>
                  </div>
                ))}
              </div>

              <div className="bg-gray-50 rounded-lg p-6">
                <h3 className="text-lg font-semibold text-gray-800 mb-4">Category Distribution</h3>
                <div className="space-y-4">
                  {[
                    { name: 'Service', count: stats.Service, color: 'bg-green-500' },
                    { name: 'Facilities', count: stats.Facilities, color: 'bg-blue-500' },
                    { name: 'Administration', count: stats.Administration, color: 'bg-purple-500' },
                    { name: 'General', count: stats.General, color: 'bg-gray-500' }
                  ].map((cat) => (
                    <div key={cat.name} className="flex items-center justify-between">
                      <div className="flex items-center space-x-3">
                        <div className={`w-4 h-4 rounded ${cat.color}`}></div>
                        <span className="font-medium text-gray-700">{cat.name}</span>
                      </div>
                      <div className="flex items-center space-x-4">
                        <div className="w-32 md:w-56 bg-gray-200 rounded-full h-2.5">
                          <div
                            className={`h-2.5 rounded-full transition-all duration-500 ${cat.color}`}
                            style={{ width: `${total > 0 ? (cat.count / total) * 100 : 0}%` }}
                          ></div>
                        </div>
                        <span className="text-sm font-medium text-gray-600 w-12 text-right">
                          {getPercentage(cat.count)}%
                        </span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {total > 0 && (
                <div className="mt-6 p-4 bg-blue-50 rounded-lg flex items-center space-x-2 text-blue-800">
                  <Icons.TrendingUp className="w-5 h-5" />
                  <span className="font-semibold">Total Feedback Processed: {total}</span>
                </div>
              )}
            </div>

            {/* Feedback History */}
            <div className="bg-white rounded-xl shadow-lg p-8 border border-gray-100">
              <div className="flex items-center space-x-3 mb-6">
                <Icons.History className="w-6 h-6 text-blue-600" />
                <h2 className="text-2xl font-bold text-gray-800">Feedback History</h2>
              </div>

              <div className="flex flex-col md:flex-row gap-4 mb-6">
                <div className="flex-1 relative">
                  <div className="absolute left-3 top-3.5 text-gray-400">
                    <Icons.Search className="w-5 h-5" />
                  </div>
                  <input
                    type="text"
                    placeholder="Search feedback keywords..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                  />
                </div>

                <div className="flex items-center space-x-2">
                  <Icons.Filter className="w-5 h-5 text-gray-500" />
                  <select
                    value={filterCategory}
                    onChange={(e) => setFilterCategory(e.target.value)}
                    className="px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white"
                  >
                    <option value="All">All Categories</option>
                    <option value="Service">Service</option>
                    <option value="Facilities">Facilities</option>
                    <option value="Administration">Administration</option>
                    <option value="General">General</option>
                  </select>
                </div>
              </div>

              <div className="space-y-4">
                {filteredList.length === 0 ? (
                  <div className="text-center py-8 text-gray-500">
                    <div className="w-16 h-16 mx-auto mb-4 text-gray-300 flex items-center justify-center">
                      <Icons.MessageCircle className="w-16 h-16" />
                    </div>
                    <p className="text-lg font-medium">No feedback found</p>
                    <p className="text-sm">Try adjusting your search query or filter category</p>
                  </div>
                ) : (
                  filteredList.map((item) => {
                    const badge = getCategoryBadge(item.category);
                    return (
                      <div key={item.id} className="border border-gray-200 rounded-lg p-5 hover:shadow-md transition-shadow">
                        <div className="flex items-start justify-between mb-3">
                          <div className={`inline-flex items-center space-x-2 px-3 py-1 rounded-full border ${badge.light}`}>
                            {React.createElement(badge.icon, { className: 'w-4 h-4' })}
                            <span className="text-sm font-semibold">{item.category}</span>
                          </div>
                          <div className="text-sm text-gray-500">{item.timestamp}</div>
                        </div>

                        <p className="text-gray-800 mb-3 leading-relaxed font-medium">{item.feedback}</p>

                        <div className="flex items-center justify-between">
                          <div className="flex items-center space-x-2">
                            <span className="text-sm text-gray-600">Confidence:</span>
                            <div className="w-20 bg-gray-200 rounded-full h-2">
                              <div
                                className="bg-blue-600 h-2 rounded-full"
                                style={{ width: `${item.confidence}%` }}
                              ></div>
                            </div>
                            <span className="text-sm font-medium text-gray-700">{item.confidence}%</span>
                          </div>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            </div>
          </main>

          <footer className="bg-white border-t border-gray-200 py-6 text-center text-sm text-gray-500 mt-12">
            <p>Hotel Feedback Classifier &bull; Interactive Web Application</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
